name: web-ci

on:
  push:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint --if-present
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc -v && npx tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: npm run build


